<body>

    <!-- 统一导航栏 -->
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
        <div class="container">
            <a class="navbar-brand" href=" ">☀️ 早八监控台</a >
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>

                </div>
            </div>
        </div>

    <!-- 内容区 -->
    <main class="container">
        <!-- 首页看板：四个核心卡片 -->
        <section id="home" class="mb-4">
            <h1 class="h3">我的大二生存数据看板</h1>
            <p class="text-muted">课堂作业 · 数据来源：个人作息记录</p >
            <div class="row g-3" id="summary-cards">
                <!-- 这里用 JS 动态生成，先占位 -->
                <div class="col-md-3"><div class="card p-3 text-center">本周平均睡眠<br><span class="fs-4 fw-bold">--</span> 小时</div></div>
                <div class="col-md-3"><div class="card p-3 text-center">早八出勤率<br><span class="fs-4 fw-bold">--</span> %</div></div>
                <div class="col-md-3"><div class="card p-3 text-center">连续早睡天数<br><span class="fs-4 fw-bold">--</span> 天</div></div>
                <div class="col-md-3"><div class="card p-3 text-center">本周总学习时长<br><span class="fs-4 fw-bold">--</span> 小时</div></div>
            </div>

        <section id="data" class="mb-4">
            <h2 class="h5">作息数据筛选</h2>
            <div class="row g-2 mb-3">

                        <option value="exhausted">严重缺觉</option>
                    </select>
                </div>
            </div>

            <ul id="log-list" class="list-group"></ul>

        <section id="charts" class="mb-4">
